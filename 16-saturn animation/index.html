
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn - Cosmic Motion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space">
        <div class="stars"></div>

        <div class="nebula"></div>

        <div class="scene">
            <div class="planet">
                <div class="saturn"></div>
                <div class="ring-back"></div>
                <div class="ring-front"></div>
                <div class="moon"></div>
            </div>
        </div>

        <div class="comet"></div>

        <div class="label">
            <span>THE SOLAR SYSTEM</span>
            <h1>SATURN</h1>
            <p>Sixth planet from the Sun.</p>
        </div>

        <div class="coordinates">
            <span>RINGED GIANT</span>
            <span>° 9.537 AU</span>
        </div>
    </div>

</body>
</html>
