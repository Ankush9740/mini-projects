<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sacred Vedic Swastika (Solar Well-being Symbol) -->
  <g stroke="#E6C77A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical and arms -->
    <line x1="50" y1="20" x2="50" y2="80"/>
    <line x1="50" y1="20" x2="75" y2="20"/>
    <line x1="50" y1="80" x2="25" y2="80"/>
    <!-- Horizontal and arms -->
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="80" y1="50" x2="80" y2="75"/>
    <line x1="20" y1="50" x2="20" y2="25"/>
  </g>
  <!-- 4 Sacred Bindus (dots) -->
  <circle cx="35" cy="35" r="3.5" fill="#C99A45"/>
  <circle cx="65" cy="35" r="3.5" fill="#C99A45"/>
  <circle cx="35" cy="65" r="3.5" fill="#C99A45"/>
  <circle cx="65" cy="65" r="3.5" fill="#C99A45"/>
</svg>