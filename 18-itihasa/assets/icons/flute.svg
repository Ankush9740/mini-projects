<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Murali Bansuri Flute with Peacock Feather -->
  <!-- Peacock feather eye -->
  <ellipse cx="65" cy="25" rx="18" ry="14" transform="rotate(-30 65 25)" fill="#172B43" stroke="#688BA7" stroke-width="2"/>
  <ellipse cx="65" cy="25" rx="11" ry="8" transform="rotate(-30 65 25)" fill="#344E3D" stroke="#E6C77A" stroke-width="2"/>
  <circle cx="65" cy="25" r="4" fill="#E6C77A"/>
  <!-- Feather stem -->
  <path d="M60 35 C50 45 42 60 38 75" stroke="#E6C77A" stroke-width="2" stroke-linecap="round"/>
  <!-- Flute body -->
  <rect x="15" y="52" width="70" height="9" rx="4" transform="rotate(-20 50 56)" fill="#C99A45" stroke="#E6C77A" stroke-width="2"/>
  <!-- Flute holes -->
  <circle cx="35" cy="62" r="2.5" fill="#120C0A"/>
  <circle cx="43" cy="59" r="2.5" fill="#120C0A"/>
  <circle cx="51" cy="56" r="2.5" fill="#120C0A"/>
  <circle cx="59" cy="53" r="2.5" fill="#120C0A"/>
  <circle cx="67" cy="50" r="2.5" fill="#120C0A"/>
  <!-- Decorative tassel -->
  <path d="M22 67 C18 73 14 80 18 85" stroke="#8E3037" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="18" cy="86" r="3" fill="#E6C77A"/>
</svg>