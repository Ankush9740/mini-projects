<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" width="280" height="340" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="labelGrad_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D95745"/>
      <stop offset="100%" stop-color="#7A1C12"/>
    </linearGradient>
    <filter id="cartShadow_6">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cartridge Plastic Body -->
  <g filter="url(#cartShadow_6)">
    <!-- Main Outer Body -->
    <rect x="20" y="24" width="240" height="290" rx="8" fill="#B83828"/>
    
    <!-- Top Grip Notch Details -->
    <rect x="36" y="16" width="208" height="12" rx="4" fill="#B83828"/>
    <rect x="44" y="20" width="192" height="4" fill="#000000" opacity="0.2"/>
    <rect x="60" y="28" width="160" height="6" fill="#FFFFFF" opacity="0.15"/>

    <!-- Left & Right Grip Ridges -->
    <rect x="22" y="60" width="4" height="180" fill="#FFFFFF" opacity="0.12"/>
    <rect x="254" y="60" width="4" height="180" fill="#000000" opacity="0.3"/>

    <!-- Nintendo GAME BOY ADVANCE Header Area -->
    <rect x="40" y="42" width="200" height="32" rx="4" fill="#000000" opacity="0.25"/>
    <text x="140" y="62" font-family="'Press Start 2P', monospace" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GAME BOY ADVANCE</text>
    <text x="140" y="71" font-family="'VT323', monospace" font-size="11" fill="#FF8A7A" text-anchor="middle" letter-spacing="2">N I N T E N D O</text>

    <!-- Sticker Label Recess -->
    <rect x="38" y="86" width="204" height="204" rx="4" fill="#17283C"/>
    <rect x="40" y="88" width="200" height="200" rx="3" fill="url(#labelGrad_6)"/>

    <!-- Metallic foil sheen line on label -->
    <polygon points="40,88 90,88 40,138" fill="#FFFFFF" opacity="0.25"/>
    <polygon points="240,238 240,288 190,288" fill="#000000" opacity="0.2"/>

    <!-- Pokémon Logo & Title on Sticker -->
    <rect x="46" y="96" width="188" height="48" fill="#0E1A29" opacity="0.85" rx="3"/>
    <text x="140" y="112" font-family="'Press Start 2P', monospace" font-size="12" font-weight="bold" fill="#FFCC00" text-anchor="middle" stroke="#003399" stroke-width="0.8">POKÉMON</text>
    <text x="140" y="128" font-family="'Press Start 2P', monospace" font-size="8.5" fill="#FF8A7A" text-anchor="middle">FIRERED</text>
    <text x="140" y="139" font-family="'VT323', monospace" font-size="12" fill="#F4E8C8" text-anchor="middle" letter-spacing="1">VERSION</text>

    <!-- Center Mascot Sprite -->
    <image href="data:image/png;base64," x="76" y="146" width="128" height="128" preserveAspectRatio="xMidYMid meet" style="image-rendering: pixelated;"/>

    <!-- Seal of Quality & ESRB -->
    <circle cx="62" cy="268" r="12" fill="#E9B94E" stroke="#B8860B" stroke-width="1.5"/>
    <text x="62" y="271" font-family="'VT323', monospace" font-size="8" fill="#17283C" font-weight="bold" text-anchor="middle">OFFICIAL</text>
    
    <rect x="210" y="254" width="22" height="26" fill="#FFFFFF" rx="2"/>
    <rect x="212" y="256" width="18" height="22" fill="#17283C"/>
    <text x="221" y="272" font-family="'Press Start 2P', monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">E</text>

    <!-- Bottom Arrow Notch -->
    <polygon points="140,314 130,302 150,302" fill="#000000" opacity="0.3"/>
  </g>
</svg>