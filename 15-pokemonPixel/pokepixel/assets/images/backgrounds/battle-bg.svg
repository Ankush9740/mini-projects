<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="240" fill="#78B8E8"/>
  <rect x="0" y="240" width="800" height="260" fill="#8BAC65"/>
  
  <!-- Battle Grid Lines -->
  <line x1="0" y1="240" x2="800" y2="240" stroke="#426B42" stroke-width="4"/>

  <!-- Opponent Platform (Far Right) -->
  <ellipse cx="600" cy="220" rx="140" ry="40" fill="#B8D888" stroke="#5E8C3E" stroke-width="4"/>
  <ellipse cx="600" cy="223" rx="130" ry="34" fill="#CBE89A"/>

  <!-- Player Platform (Foreground Left) -->
  <ellipse cx="220" cy="390" rx="190" ry="60" fill="#9BC374" stroke="#426B42" stroke-width="6"/>
  <ellipse cx="220" cy="395" rx="175" ry="50" fill="#B0D888"/>
  
  <!-- Dialogue Bar Base -->
  <rect x="0" y="420" width="800" height="80" fill="#17283C"/>
  <rect x="6" y="426" width="788" height="68" fill="#F4E8C8" stroke="#49372B" stroke-width="4"/>
</svg>