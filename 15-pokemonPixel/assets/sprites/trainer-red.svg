<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="32" height="40" shape-rendering="crispEdges">
  <!-- Red Cap -->
  <rect x="8" y="2" width="16" height="4" fill="#D95745"/>
  <rect x="6" y="6" width="20" height="4" fill="#D95745"/>
  <rect x="6" y="8" width="6" height="2" fill="#FFFFFF"/>
  <rect x="20" y="6" width="6" height="3" fill="#17283C"/> <!-- Visor -->

  <!-- Face & Hair -->
  <rect x="8" y="10" width="14" height="6" fill="#FADCB6"/>
  <rect x="6" y="10" width="2" height="4" fill="#3D2817"/> <!-- Hair -->
  <rect x="18" y="11" width="2" height="3" fill="#17283C"/> <!-- Eye -->

  <!-- Vest / Jacket (Red & Black) -->
  <rect x="6" y="16" width="18" height="10" fill="#D95745"/>
  <rect x="10" y="16" width="8" height="10" fill="#17283C"/>
  <rect x="8" y="17" width="2" height="8" fill="#FFFFFF"/>
  <rect x="18" y="17" width="2" height="8" fill="#FFFFFF"/>

  <!-- Hands -->
  <rect x="4" y="20" width="3" height="4" fill="#FADCB6"/>
  <rect x="23" y="20" width="3" height="4" fill="#FADCB6"/>

  <!-- Belt -->
