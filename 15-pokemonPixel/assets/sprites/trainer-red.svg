  <!-- Pants (Blue) -->
  <rect x="8" y="28" width="6" height="8" fill="#2A4B7C"/>
  <rect x="16" y="28" width="6" height="8" fill="#2A4B7C"/>

  <!-- Shoes (Red & White) -->
  <rect x="6" y="36" width="8" height="3" fill="#D95745"/>
  <rect x="16" y="36" width="8" height="3" fill="#D95745"/>
  <rect x="7" y="38" width="7" height="1" fill="#FFFFFF"/>
  <rect x="17" y="38" width="7" height="1" fill="#FFFFFF"/>
</svg>